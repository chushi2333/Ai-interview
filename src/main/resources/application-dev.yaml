server:
  port: 8080

spring:
  application:
    name: ai-interview

  config:
    import:
      - classpath:redis-cache.yml

  datasource:
    url: jdbc:mysql://localhost:3306/interview?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  secret: 初时的本地配置文件chushi2333的密钥为什么chushi2333的密钥是可以的因为他是chushi2333
  expiration: 604800

# MyBatis 配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.chushi.aiinterview: DEBUG
    org.mybatis: DEBUG